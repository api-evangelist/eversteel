name: EVERSTEEL
description: 'EVERSTEEL is a University of Tokyo-originated startup building AI image-recognition systems
  that automate the inspection and grading of steel (iron) scrap for steelmakers. Its flagship product,
  Tetsu-Navi Inspection AI (鉄ナビ検収AI), uses high-resolution cameras and computer-vision models to grade
  incoming scrap, detect impurities and hazardous materials, and standardize what was previously a manual,
  expert-dependent process — advancing steel recycling and reducing CO2 emissions from steel production.
  The company works with major Japanese steel producers including JFE Steel and Kyoei Steel, and is backed
  by DCM Ventures, Mitsui & Co., Coreline, and the University of Tokyo.'
